<head>
<meta content="en-us" http-equiv="Content-Language">
<style type="text/css">
.newStyle1 {
    background-color: #000000;
}
.style2 {
    color: #FFFFFF;
}
.style3 {
    border-width: 2px;
    background-color: #202020;
    border: 1px solid #000;
}
.horizon-line {
    width: 100%;
    height: 3px;
    background: #00A19B;
    border: none;
}
.button {
    background: #00A19B;
    border-radius: 8px;    
}
.newStyle2 {
    padding-left: 50px;
}

#list {
    color: #FFFFFF;
    font-family: Arial, Helvetica, sans-serif;
}
</style>
</head>

<body class="newStyle1">

<table style="border-color: #000000; border-width: 0; width: 100%; border-spacing: 0;" align="center" cellpadding="2" cellspacing="0">
    <tr>
        <td style="text-align: left; color: #FFFFFF; font-family: 'Instrument Serif'; font-size: 120px; padding-left: 15px; line-height: 1.2; height: 100px; ">
                Registration</td>
    </tr>
    <tr>
        <td style="text-align: left; padding-left: 20px; font-size:20px">
        <h1 id="title">
        <span style="color: #FFFFFF; font-family: Arial, Helvetica, sans-serif;">
                Welcome!</span></h1>
        </td>
    </tr>
        <tr>
        <td style="padding: 0; height: 3;">
            <div class="horizon-line" style="margin-bottom: 0px; text-align: center;"></div>
        </td>
    </tr>

    <tr>
        <td style="text-align: center; padding-top: 20px; padding-left:10px; font-size:15px;">
        <table style="width: 100%">
            <tr>
                <td style="text-align: left">
        <h1><span style="color: #FFFFFF; font-family: Arial, Helvetica, sans-serif;">
                <em>Please enter your name to Login:</em><br></h1>
                <form method="post" onsubmit="event.preventDefault(); addName();">
                    <input id="name" name="Text1" style="width: 365px;height: 38px" type="text"><span style="color: #FFFFFF; padding-left: 10px;font-family: Arial, Helvetica, sans-serif;">
                        <input id="greet" name="Button1" class="button" type="button" value="Enter"  style="height: 38px; width: 74px"></span>
                </form>
                <ul id="list"></ul>
                <br></span></td>
            </tr>
        </table>
        </td>
    </tr>

</table>

<script type="text/javascript">
function addName(){
    const input = document.getElementById('name');
    const name = input.value.trim();
    if (!name) return;

    document.getElementById('title').innerHTML = `<span style="color: #FFFFFF; font-family: Arial, Helvetica, sans-serif;">Hello, ${name}!</span>`;
    const li = document.createElement('li');
        li.textContent = name;
        document.getElementById('list').appendChild(li);

        input.value = ''; 
    }

    function removeName(e) {
        if (e.target.nodeName === 'LI') {
            const name = e.target.textContent;
            document.getElementById('title').innerHTML = `<span style="color: #FFFFFF; font-family: Arial, Helvetica, sans-serif;">Goodbye, ${name}! see you later.</span>`;
            e.target.remove(); 
        }
    }

    document.getElementById('greet').addEventListener('click', addName);
    document.getElementById('list').addEventListener('click', removeName);
</script>
</body>
